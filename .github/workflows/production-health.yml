name: Production health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: true
jobs:
  smoke:
    name: Check production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL || 'https://www.fixxflow.app' }}
      REQUIRE_READINESS: 'true'
      SMOKE_READINESS_TOKEN: ${{ secrets.HEALTH_CHECK_SECRET }}
      SMOKE_TIMEOUT_MS: '10000'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run test:smoke
