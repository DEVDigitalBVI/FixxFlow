name: Deployment smoke
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS URL of the exact Vercel deployment to verify
        required: true
        type: string
      environment:
        description: GitHub environment whose approval and secrets apply
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Commit SHA expected in the deployment; defaults to the selected branch SHA
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deployment-smoke-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  smoke:
    name: Verify ${{ inputs.environment }} deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      EXPECTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      REQUIRE_READINESS: 'true'
      SMOKE_READINESS_TOKEN: ${{ secrets.HEALTH_CHECK_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SMOKE_EVIDENCE_PATH: smoke-evidence.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:manifest -- --output release-manifest.json --require-clean
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v6
        with:
          name: deployment-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            smoke-evidence.json
            release-manifest.json
          if-no-files-found: error
          retention-days: 90
