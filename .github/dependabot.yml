version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Tortola
    open-pull-requests-limit: 5
    groups:
      # pglite-pgtap pins an exact pglite peer version; update them together.
      pglite:
        patterns:
          - '@electric-sql/pglite'
          - '@electric-sql/pglite-pgtap'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Tortola
    open-pull-requests-limit: 5
